name: Qwen Job Worker

on:
  workflow_dispatch:
    inputs:
      candidate_index:
        description: "Candidate index from current discovery feed"
        required: true
        default: "0"
      register_state:
        description: "Persist campaign state after successful processing"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - "run-trigger.txt"

permissions:
  contents: write

concurrency:
  group: qwen-job-worker
  cancel-in-progress: false

jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "qwen/qwen3.8-27b"
      QWEN_MAX_TOKENS: "950"
      QWEN_TEMP: "0.20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Groq secret exists
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is missing"
            exit 1
          fi
          echo "Groq key detected"

      - name: Refresh public discovery feed
        shell: bash
        run: |
          if python -u worker/source_engine.py; then
            echo "Discovery refresh succeeded"
          else
            echo "Discovery refresh unavailable; using checked-in discovery snapshot"
            test -s data/discovery/jo-jobs.json
          fi

      - name: Run Groq Qwen worker
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INDEX="${{ github.event.inputs.candidate_index }}"
            REGISTER="${{ github.event.inputs.register_state }}"
          else
            INDEX="$(awk -F': *' '/^candidate_index:/ {print $2; exit}' run-trigger.txt)"
            REGISTER="$(awk -F': *' '/^register_state:/ {print $2; exit}' run-trigger.txt)"
            INDEX="${INDEX:-0}"
            REGISTER="${REGISTER:-false}"
          fi
          echo "Candidate index: $INDEX"
          ARGS=(--index "$INDEX" --output data/results/latest.json)
          if [ "$REGISTER" != "true" ]; then
            ARGS+=(--no-register)
          fi
          python -u worker/run_worker.py "${ARGS[@]}"

      - name: Zero-paid-AI verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          d = json.loads(Path("data/results/latest.json").read_text(encoding="utf-8"))
          assert d["ai"]["paid_api_used"] is False
          assert d["ai"]["paid_fallback_used"] is False
          assert d["ai"]["provider"] == "groq_free_plan"
          assert d["policy"]["paid_ai_allowed"] is False
          assert d["policy"]["paid_fallback_allowed"] is False
          if d["publication_package"]["action"] != "do_not_republish":
              image_url = d["canonical"].get("featured_image_url") or ""
              image_path = d["canonical"].get("featured_image_path") or ""
              assert "-ai-v1.png" in image_url
              assert image_path and Path(image_path).exists()
              with Image.open(image_path) as im:
                  assert im.size == (1280, 720)
              assert d["policy"]["competitor_discovery_links_publicly_exposed"] is False
          print("ZERO-PAID-AI CHECK: PASS")
          print("Model:", d["ai"].get("model"))
          print("Usage:", d["ai"].get("usage"))
          print("Title:", d["publication_package"].get("title"))
          print("Featured image:", d["canonical"].get("featured_image_url"))
          print("Dedupe:", d["dedupe"]["action"])
          print("Publication action:", d["publication_package"]["action"])
          PY

      - name: Save public worker result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/jo-jobs.json data/results/latest.json data/state/job_campaigns.json data/images/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "Save Groq Qwen worker result"
          git pull --rebase origin main
          git push

name: Apply Approved Marsad Job Image Template

on:
  push:
    branches: ["main"]
    paths:
      - "worker/exact_template_asset/**"
      - "worker/unified_job_template.py"
      - "worker/unified_template_runtime.py"
      - "worker/regenerate_unified_template_live.py"
      - "worker/job_image_v12.py"
      - "worker/run_worker.py"
      - ".github/workflows/regenerate-unified-template.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marsad-approved-job-images
  cancel-in-progress: true

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Arabic title font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify approved مرصد الوظائف master asset
        run: |
          PYTHONPATH=worker python - <<'PY'
          from unified_job_template import _master, MASTER_SHA256, PREFIX
          expected='74b242e85105249849995846a39e9bc13285ace4be15d3a90879f4d6d0d37fbe'
          im=_master()
          assert im.size==(1280,720), im.size
          assert MASTER_SHA256==expected, MASTER_SHA256
          assert PREFIX=='مطلوب'
          print('MARSAD MASTER VERIFIED:', MASTER_SHA256)
          PY

      - name: Regenerate all 16 current live-post images
        run: PYTHONPATH=worker python -u worker/regenerate_unified_template_live.py

      - name: Validate final مرصد الوظائف image set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          expected_sha='74b242e85105249849995846a39e9bc13285ace4be15d3a90879f4d6d0d37fbe'
          d=json.loads(Path('data/results/live-blogger-ai-images.json').read_text(encoding='utf-8'))
          assert d['count']==16 and d['failure_count']==0, (d.get('count'), d.get('failure_count'))
          assert d.get('image_system')=='marsad-approved-master-v2', d.get('image_system')
          assert d.get('brand')=='مرصد الوظائف', d.get('brand')
          assert d.get('master_sha256')==expected_sha
          assert d.get('background_variation_allowed') is False
          assert d.get('only_variable')=='job_title'
          assert d.get('title_prefix')=='مطلوب'
          ids=set()
          for item in d['items']:
              ids.add(str(item['post_id']))
              p=Path(item['featured_image_path'])
              u=item['featured_image_url']
              assert p.name.startswith('job-') and p.name.endswith('-ai-v1.png'), p
              assert p.exists() and p.stat().st_size > 60000, (p, p.stat().st_size if p.exists() else None)
              assert '/main/data/images/' in u and u.endswith(p.name), u
              assert item.get('brand')=='مرصد الوظائف'
              assert item.get('master_sha256')==expected_sha
              assert item.get('only_variable')=='job_title'
              assert item.get('title_prefix')=='مطلوب'
              with Image.open(p) as im:
                  assert im.size==(1280,720), im.size
          assert len(ids)==16
          print('MARSAD APPROVED TEMPLATE 16/16: PASS')
          PY

      - name: Prepare review previews
        run: |
          rm -rf data/marsad-template-preview
          mkdir -p data/marsad-template-preview
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          d=json.loads(Path('data/results/live-blogger-ai-images.json').read_text(encoding='utf-8'))
          for i,item in enumerate(d['items'][:6],1):
              shutil.copy2(item['featured_image_path'], Path('data/marsad-template-preview')/f'preview-{i}.png')
          PY

      - name: Commit regenerated production images in place
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images/job-*-ai-v1.png data/results/live-blogger-ai-images.json
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Apply approved مرصد الوظائف master to all live images"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: marsad-approved-job-image-previews
          path: data/marsad-template-preview
          retention-days: 30

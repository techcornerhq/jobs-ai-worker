name: Diagnose Brand Assets

on:
  push:
    branches: ["job-image-v13-template"]
    paths:
      - ".github/workflows/diagnose-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 Pillow
      - name: Print candidates
        run: |
          PYTHONPATH=worker python - <<'PY'
          from company_visual_v13 import OFFICIAL_SEEDS, _candidate_assets
          for employer, pages in OFFICIAL_SEEDS.items():
              if employer not in {'جامعة عمان العربية','ابن الهيثم','سختيان','حلاوة'}:
                  continue
              print('\n###', employer)
              for page in pages:
                  print('PAGE', page)
                  for row in _candidate_assets(page, employer)[:20]:
                      print(row)
          PY

name: Regenerate Existing AI Job Images

on:
  workflow_dispatch:
  push:
    branches: ["dynamic-ai-job-images"]
    paths:
      - "worker/regenerate_existing_images_dynamic.py"
      - "worker/ai_job_image.py"
      - "worker/ai_job_image_runtime.py"
      - ".github/workflows/regenerate-existing-ai-images.yml"

permissions:
  contents: write

concurrency:
  group: regenerate-existing-ai-images
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate images for all published posts
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          JOB_IMAGE_MODEL: "flux"
        run: PYTHONPATH=worker python -u worker/regenerate_existing_images_dynamic.py
      - name: Validate migration package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p = Path('data/results/ui-migration-ai-images.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['count'] == 7 and d['failure_count'] == 0
          for item in d['items']:
              c = item['canonical']
              u = c.get('featured_image_url') or ''
              fp = Path(c.get('featured_image_path') or '')
              assert '-ai-v1.png' in u, u
              assert fp.exists() and fp.stat().st_size > 80000, fp
              with Image.open(fp) as im:
                  assert im.size == (1536, 1024), im.size
              content = item['publication_package'].get('content') or ''
              assert u in content
              assert not any(ch in content for ch in ('□','\ufffd','■','▪','▫'))
          print('AI IMAGE MIGRATION VALIDATION: PASS')
          PY
      - name: Commit generated migration assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images/*-ai-v1.png data/results/ui-migration-ai-images.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate dynamic AI images for published jobs"
          git pull --rebase origin dynamic-ai-job-images
          git push origin HEAD:dynamic-ai-job-images
      - name: Upload migration preview
        uses: actions/upload-artifact@v4
        with:
          name: existing-job-ai-images
          path: |
            data/images/*-ai-v1.png
            data/results/ui-migration-ai-images.json
